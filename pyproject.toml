[project]
name = "eagle-eyes"
version = "0.1.0"
description = "Root-cause analysis for RPA bot failures"
requires-python = ">=3.10"
# The core runs on the standard library alone: the mock backend, the whole
# pipeline and the entire test suite need nothing installed. That is deliberate
# -- a tool that needs a working pip before it can be tried is a tool that does
# not get tried on a locked-down desktop.
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]          # real analysis via a direct key
bedrock = ["anthropic[bedrock]>=0.40"]   # real analysis via AWS Bedrock
# The hosted web product. Four dependencies, none of which the CLI or the test
# suite touches -- `eagle_eyes.web` is the only package that imports them.
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
# PostgreSQL, for a hosted deployment. Not required by the CLI, which uses
# SQLite, nor by the tests -- which run against PostgreSQL too when
# EAGLE_EYES_TEST_DSN names a server, and skip those checks otherwise.
postgres = [
    "psycopg[binary]>=3.1",
    "psycopg_pool>=3.2",
]

[project.scripts]
eagle-eyes = "eagle_eyes.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["eagle_eyes", "eagle_eyes.web"]

[tool.setuptools.package-data]
eagle_eyes = ["schema.sql", "schema_pg.sql", "patterns.json", "prompts/*.txt", "prompts/*.json"]
"eagle_eyes.web" = ["templates/*.html", "static/*"]
